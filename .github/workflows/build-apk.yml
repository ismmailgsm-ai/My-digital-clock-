
name: Build Digital Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "Main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Python file
        run: |
          if [ ! -f main.py ] && [ -f Main.py ]; then
            cp Main.py main.py
          fi

          if [ ! -f main.py ]; then
            echo "ERROR: main.py is missing"
            exit 1
          fi

          python3 -m py_compile main.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            build-essential \
            autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33" buildozer

      - name: Build Android APK
        run: |
          buildozer android debug
        env:
          ACCEPT_EULA: "Y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Digital-Clock-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
